    footer {

      font-size: 0.75rem;

    footer strong {

      font-family: "Archivo Black", Impact, sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--paper);

    /* Bigger phones / tablets / desktops: fill remaining viewport with full image visible */
    @media (min-width: 700px) {
