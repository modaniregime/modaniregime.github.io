  <style>
    :root {
      --ink: #1a1410;

      --paper: #e8dfd0;
      --gold: #d4a017;
      --blood: #b91c1c;

    *, *::before, *::after { box-sizing: border-box; }

    html {

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: var(--paper);
      font-family: "Newsreader", Georgia, serif;
      background:

        radial-gradient(ellipse 70% 45% at 90% 75%, rgba(212, 160, 23, 0.1), transparent 50%),
        linear-gradient(165deg, #2a221c 0%, #1a1410 45%, #0f0c0a 100%);
      background-attachment: fixed;
    }

    .stage {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      min-height: 0;
      width: 100%;
    }

    header {
      flex: 0 0 auto;
      padding: clamp(1rem, 3vw, 1.75rem) clamp(1rem, 4vw, 2.5rem) 0;
      text-align: center;
      animation: rise 0.9s ease-out both;

      margin: 0;

      line-height: 1.05;
      color: var(--paper);
      text-wrap: balance;
    }

    .headline .accent {
      color: var(--blood);
    }

    .site-mark {
      margin: 0.55rem 0 0;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(0.7rem, 1.8vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .hero {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      margin-top: clamp(0.75rem, 2vw, 1.25rem);
      animation: fade-scale 1.1s ease-out 0.15s both;
    }

    .hero img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .cta-bar {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      padding: clamp(0.85rem, 2.5vw, 1.35rem) 1rem;
      animation: rise 0.9s ease-out 0.35s both;
    }

    a.video-link {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.9rem 1.6rem;
      background: var(--blood);
      color: #fff;
      text-decoration: none;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    a.video-link:hover {
      background: #951515;
      transform: translateY(-2px);
    }

    a.video-link:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    a.video-link svg {
      flex-shrink: 0;
    }

    footer {
      flex: 0 0 auto;
      width: 100%;
      padding: 1rem clamp(1rem, 4vw, 2.5rem) 1.35rem;
      border-top: 1px solid rgba(196, 184, 168, 0.25);
      text-align: center;
      font-size: clamp(0.75rem, 2vw, 0.875rem);
      line-height: 1.6;
      color: var(--dust);
      background: var(--smoke);
      animation: rise 0.9s ease-out 0.4s both;
    }

    footer strong {
      display: block;
      margin-bottom: 0.3rem;
      font-family: "Archivo Black", Impact, sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--paper);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-scale {
      from {
        opacity: 0;
        transform: scale(0.985);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      header,
      .hero,
      .cta-bar,
      footer {
        animation: none;
      }

      a.video-link:hover {
        transform: none;
      }
    }
  </style>
</head>
